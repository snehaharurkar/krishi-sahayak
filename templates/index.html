<!DOCTYPE html>
<html>
<head>
    <title>Rice Plant Disease Detector</title>
    <body>
    
    <style>
        body {
            background: #7ec850;
            font-family: Arial;
        }
        .card {
            width: 500px;
            background: #f6fff0;
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        img {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }

        .camera-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 15px;
        gap: 10px; /* space between video and button */
        }

        .result {
            margin-top: 20px;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Rice Plant Disease Detector</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br>
        <button type="submit">Predict Disease</button>
    </form>

    

    
    <hr>

    <!-- Camera Capture -->
<h3>Capture from Camera:</h3>
<div class="camera-container">
    <video id="video" width="320" height="240" autoplay></video>
    <button id="capture">Capture</button>
</div>
<canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

<form id="cameraForm" method="POST">
    <input type="hidden" name="camera_image" id="camera_image">
    <button type="submit">Predict Disease</button>
</form>



    

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture');
        const cameraImageInput = document.getElementById('camera_image');

        // Access camera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => video.srcObject = stream)
            .catch(err => console.error("Camera not available", err));

        // Capture image
        captureBtn.addEventListener('click', () => {
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataURL = canvas.toDataURL('image/jpeg');
            cameraImageInput.value = dataURL;
            
        });
    </script>

    {% if prediction %}
        <div class="result">
            <img src="{{ image_path }}" width="300"><br>
            <h3>Prediction Result</h3>
            <p><b>Disease:</b> {{ prediction }}</p>
            <p><b>Confidence:</b> {{ confidence }}%</p>
        </div>
    {% endif %}
</div>

</body>
</html>
